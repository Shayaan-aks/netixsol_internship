name: CI — Real Estate Voice Agent

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  GEMINI_API_KEY: "test_fake_key_ci"  # Unit tests mock LLM calls — no real key needed

jobs:
  # ─── Job 1: Security Scan ────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ \
            --skip B101,B601 \
            --severity-level medium \
            -f txt \
            -o bandit_report.txt || true
          cat bandit_report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit_report.txt

  # ─── Job 2: Unit & Integration Tests ────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        working-directory: Week-7/day-6/production_ready
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: Week-7/day-6/production_ready
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test_results.xml \
            -p no:warnings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Week-7/day-6/production_ready/test_results.xml

  # ─── Job 3: Docker Build Validation ──────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: Week-7/day-6/production_ready
        run: |
          docker build \
            --tag real-estate-agent:ci-${{ github.sha }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Test Docker image health
        run: |
          docker run -d \
            --name test_agent \
            -p 8000:8000 \
            -e GEMINI_API_KEY=test_key \
            real-estate-agent:ci-${{ github.sha }}
          sleep 15
          curl --fail http://localhost:8000/health || (docker logs test_agent && exit 1)
          docker stop test_agent
          docker rm test_agent
