global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@netixsol.com"
  smtp_auth_username: "alerts@netixsol.com"
  smtp_auth_password: "${SMTP_PASSWORD}"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: critical_alerts
      group_wait: 10s
      repeat_interval: 30m
    - match:
        team: security
      receiver: security_team
    - match:
        team: business
      receiver: business_team

receivers:
  - name: "default"
    email_configs:
      - to: "platform@netixsol.com"
        send_resolved: true

  - name: "critical_alerts"
    email_configs:
      - to: "oncall@netixsol.com"
        send_resolved: true
        headers:
          Subject: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
    # In production: add PagerDuty/Slack here
    # pagerduty_configs:
    #   - routing_key: "${PAGERDUTY_KEY}"
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK}"
    #     channel: "#alerts-critical"

  - name: "security_team"
    email_configs:
      - to: "security@netixsol.com"
        send_resolved: true
        headers:
          Subject: "⚠️ Security Alert: {{ .GroupLabels.alertname }}"

  - name: "business_team"
    email_configs:
      - to: "business@netixsol.com"
        send_resolved: true

inhibit_rules:
  # Suppress warning alerts when critical alert is already firing
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
