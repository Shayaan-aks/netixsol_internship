apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: real-estate-ai
data:
  ENVIRONMENT: "production"
  APP_NAME: "NetixSol Real Estate AI Platform"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  DB_POOL_SIZE: "20"
  RATE_LIMIT_PER_MINUTE: "60"
  CORS_ORIGINS: "https://netixsol.com,https://app.netixsol.com"
  VOICE_LANGUAGE: "ur-PK"
  TTS_VOICE: "ur-PK-UzmaNeural"
  LLM_MODEL: "gemini-2.5-flash"
