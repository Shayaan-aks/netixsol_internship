name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Week-7/day-7/backend/requirements.txt
        
    - name: Run PyTest
      run: |
        pytest Week-7/day-7/tests/
        
    - name: Build Docker Image
      run: |
        docker build -f Week-7/day-7/deployment/docker/Dockerfile.api -t real-estate-agent:latest Week-7/
